name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 필드(pnpm@10.x)를 읽어 동일 버전 설치
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # api 테스트는 workerd(miniflare) 안에서 실제 D1로 돈다 — 별도 서비스 불필요
      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @1ott/web build
